name: Publish Crystra release candidates

on:
  push:
    branches: [release/next]

permissions:
  contents: read

concurrency:
  group: release-candidate
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-node@v7
        with:
          node-version: '24.12.0'
      - name: Validate one explicit candidate request
        id: request
        run: |
          test "$GITHUB_REF_NAME" = release/next
          node --input-type=module <<'JS'
          import {readFileSync,appendFileSync} from 'node:fs';
          import {validateReleaseRequest} from './scripts/lib/combination-release.mjs';
          const request=validateReleaseRequest(JSON.parse(readFileSync('release/request.json','utf8')));
          appendFileSync(process.env.GITHUB_OUTPUT,`kind=${request.kind}\ntag=${request.candidateTag}\n`);
          JS
      - name: Build from selected committed sources and immutable inputs
        run: node scripts/build-combination-candidate.mjs "$RUNNER_TEMP/candidate"
      - uses: docker/setup-buildx-action@v4
        if: steps.request.outputs.kind == 'services'
      - name: Install isolated service qualification dependencies
        if: steps.request.outputs.kind == 'services'
        run: npm ci --prefix qualification/service-release --ignore-scripts --no-audit --no-fund
      - name: Qualify exact service archive against real containers
        if: steps.request.outputs.kind == 'services'
        run: node qualification/service-release/qualify.mjs "$RUNNER_TEMP/candidate"
      - name: Qualify exact installed plugin dependencies and service binding
        if: steps.request.outputs.kind == 'combination'
        run: node scripts/qualify-combination-candidate.mjs "$RUNNER_TEMP/candidate"
      - name: Admit qualification and render human release preview
        run: |
          # Uses scripts/render-release-preview.mjs after exact qualification admission.
          node scripts/finalize-combination-candidate.mjs "$RUNNER_TEMP/candidate"
          RELEASE_PREVIEW="$RUNNER_TEMP/candidate/release-preview.md"
          cat "$RELEASE_PREVIEW" >> "$GITHUB_STEP_SUMMARY"
          echo "RELEASE_PREVIEW=$RELEASE_PREVIEW" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.request.outputs.tag }}
          path: ${{ runner.temp }}/candidate/*
          if-no-files-found: error
          retention-days: 30
      - id: release-app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.CRYSTRA_RELEASE_CLIENT_ID }}
          private-key: ${{ secrets.CRYSTRA_RELEASE_APP_PRIVATE_KEY }}
          owner: firestige
          repositories: crystra
      - name: Publish immutable qualified candidate
        env:
          GH_TOKEN: ${{ steps.release-app.outputs.token }}
          CANDIDATE_TAG: ${{ steps.request.outputs.tag }}
        run: |
          # Existing tags fail closed; use a new RC number, never overwrite bytes.
          gh release create "$CANDIDATE_TAG" "$RUNNER_TEMP/candidate"/* \
            --repo firestige/crystra --target "$GITHUB_SHA" --prerelease \
            --title "$CANDIDATE_TAG" --notes-file "$RELEASE_PREVIEW"
