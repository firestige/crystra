name: Promote qualified Crystra release

# Filename is retained as the topology's manual promotion authority.
on:
  workflow_dispatch:
    inputs:
      candidate_tag:
        description: Exact published Crystra services or combination RC tag
        required: true
        type: string
      authority_ref:
        description: Full commit SHA containing the selected RC and GA manifests
        required: true
        type: string
      release_manifest:
        description: release/services/X.Y.Z.json or release/combinations/X.Y.Z.json
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-promotion
  cancel-in-progress: false

jobs:
  promote-qualified-set:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate immutable authority
        env:
          AUTHORITY_REF: ${{ inputs.authority_ref }}
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
        run: |
          [[ "$AUTHORITY_REF" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CANDIDATE_TAG" =~ ^crystra(-services)?-v[0-9]+\.[0-9]+\.[0-9]+-rc\.[1-9][0-9]*$ ]]
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.authority_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24.12.0'
      - name: Download exact published predecessor
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
        run: gh release download "$CANDIDATE_TAG" --repo firestige/crystra --dir "$RUNNER_TEMP/candidate"
      - name: Verify published source, qualification and unchanged GA content
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
          RELEASE_MANIFEST: ${{ inputs.release_manifest }}
        run: node scripts/prepare-combination-promotion.mjs "$RUNNER_TEMP/candidate" "$RELEASE_MANIFEST" "$RUNNER_TEMP/promotion" "$CANDIDATE_TAG"
      - id: release-app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.CRYSTRA_RELEASE_CLIENT_ID }}
          private-key: ${{ secrets.CRYSTRA_RELEASE_APP_PRIVATE_KEY }}
          owner: firestige
          repositories: crystra
      - name: Publish verified bytes without rebuilding
        env:
          GH_TOKEN: ${{ steps.release-app.outputs.token }}
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
        run: |
          TAG="$(jq -er .tag "$RUNNER_TEMP/promotion/promotion.json")"
          COMMIT="$(jq -er .commit "$RUNNER_TEMP/promotion/promotion.json")"
          gh release create "$TAG" "$RUNNER_TEMP/promotion"/* \
            --repo firestige/crystra --target "$COMMIT" --title "$TAG" \
            --notes "Promoted unchanged qualified bytes from $CANDIDATE_TAG. GA identity: promotion-manifest.json."
