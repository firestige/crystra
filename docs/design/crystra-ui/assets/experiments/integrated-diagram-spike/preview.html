ra.test/spike\">\n  \u003cbpmn:process id=\"Process\" isExecutable=\"false\">\n    \u003cbpmn:startEvent id=\"s\" name=\"开始\">\n      \u003cbpmn:outgoing>edge-1\u003c/bpmn:outgoing>\n    \u003c/bpmn:startEvent>\n    \u003cbpmn:subProcess id=\"plan\" name=\"理解与设计\">\n      \u003cbpmn:incoming>edge-1\u003c/bpmn:incoming>\n      \u003cbpmn:incoming>reconsider-design\u003c/bpmn:incoming>\n      \u003cbpmn:outgoing>edge-6\u003c/bpmn:outgoing>\n      \u003cbpmn:startEvent id=\"plan_start\">\n        \u003cbpmn:outgoing>plan_entry_bridge\u003c/bpmn:outgoing>\n      \u003c/bpmn:startEvent>\n      \u003cbpmn:endEvent id=\"plan_end\">\n        \u003cbpmn:incoming>plan_exit_bridge\u003c/bpmn:incoming>\n      \u003c/bpmn:endEvent>\n      \u003cbpmn:task id=\"read\" name=\"理解需求与系统设计\">\n        \u003cbpmn:incoming>edge-4\u003c/bpmn:incoming>\n        \u003cbpmn:incoming>plan_entry_bridge\u003c/bpmn:incoming>\n        \u003cbpmn:outgoing>edge-2\u003c/bpmn:outgoing>\n      \u003c/bpmn:task>\n      \u003cbpmn:exclusiveGateway id=\"clear\" name=\"材料足够？\">\n        \u003cbpmn:incoming>edge-2\u003c/bpmn:incoming>\n        \u003cbpmn:outgoing>edge-3\u003c/bpmn:outgoing>\n        \u003cbpmn:outgoing>edge-5\u003c/bpmn:outgoing>\n      \u003c/bpmn:exclusiveGateway>\n      \u003cbpmn:task id=\"ask\" name=\"澄清缺口\">\n        \u003cbpmn:incoming>edge-3\u003c/bpmn:incoming>\n        \u003cbpmn:outgoing>edge-4\u003c/bpmn:outgoing>\n      \u003c/bpmn:task>\n      \u003cbpmn:task id=\"design\" name=\"完成详细设计与测试目标\">\n        \u003cbpmn:incoming>edge-5\u003c/bpmn:incoming>\n        \u003cbpmn:outgoing>plan_exit_bridge\u003c/bpmn:outgoing>\n      \u003c/bpmn:task>\n      \u003cbpmn:sequenceFlow id=\"edge-2\" name=\"\" sourceRef=\"read\" targetRef=\"clear\" />\n      \u003cbpmn:sequenceFlow id=\"edge-3\" name=\"材料缺失，补充澄清\" sourceRef=\"clear\" targetRef=\"ask\" />\n      \u003cbpmn:sequenceFlow id=\"edge-4\" name=\"\" sourceRef=\"ask\" targetRef=\"read\" />\n      \u003cbpmn:sequenceFlow id=\"edge-5\" name=\"材料完整，开始设计\" sourceRef=\"clear\" targetRef=\"design\" />\n      \u003cbpmn:sequenceFlow id=\"plan_entry_bridge\" name=\"\" sourceRef=\"plan_start\" targetRef=\"read\" />\n      \u003cbpmn:sequenceFlow id=\"plan_exit_bridge\" name=\"\" sourceRef=\"design\" targetRef=\"plan_end\" />\n    \u003c/bpmn:subProcess>\n    \u003cbpmn:subProcess id=\"work\" name=\"逐单元实现\">\n      \u003cbpmn:incoming>edge-6\u003c/bpmn:incoming>\n      \u003cbpmn:incoming>repair-implementation\u003c/bpmn:incoming>\n      \u003cbpmn:outgoing>edge-16\u003c/bpmn:outgoing>\n      \u003cbpmn:startEvent id=\"work_start\">\n        \u003cbpmn:outgoing>work_entry_bridge\u003c/bpmn:outgoing>\n      \u003c/bpmn:startEvent>\n      \u003cbpmn:endEvent id=\"work_end\">\n        \u003cbpmn:incoming>work_exit_bridge\u003c/bpmn:incoming>\n      \u003c/bpmn:endEvent>\n      \u003cbpmn:exclusiveGateway id=\"next\" name=\"还有实现单元？\">\n        \u003cbpmn:incoming>edge-14\u003c/bpmn:incoming>\n        \u003cbpmn:outgoing>edge-15\u003c/bpmn:outgoing>\n        \u003cbpmn:outgoing>work_exit_bridge\u003c/bpmn:outgoing>\n      \u003c/bpmn:exclusiveGateway>\n      \u003cbpmn:subProcess id=\"tdd\" name=\"测试与实现循环\">\n        \u003cbpmn:incoming>edge-7\u003c/bpmn:incoming>\n        \u003cbpmn:outgoing>edge-14\u003c/bpmn:outgoing>\n        \u003cbpmn:startEvent id=\"tdd_start\">\n          \u003cbpmn:outgoing>tdd_entry_bridge\u003c/bpmn:outgoing>\n        \u003c/bpmn:startEvent>\n        \u003cbpmn:endEvent id=\"tdd_end\">\n          \u003cbpmn:incoming>tdd_exit_bridge\u003c/bpmn:incoming>\n        \u003c/bpmn:endEvent>\n        \u003cbpmn:task id=\"red\" name=\"编写并校准测试\">\n          \u003cbpmn:incoming>tdd_entry_bridge\u003c/bpmn:incoming>\n          \u003cbpmn:outgoing>edge-8\u003c/bpmn:outgoing>\n        \u003c/bpmn:task>\n        \u003cbpmn:task id=\"green\" name=\"完成最小实现\">\n          \u003cbpmn:incoming>edge-8\u003c/bpmn:incoming>\n          \u003cbpmn:incoming>edge-10\u003c/bpmn:incoming>\n          \u003cbpmn:incoming>edge-13\u003c/bpmn:incoming>\n          \u003cbpmn:outgoing>edge-9\u003c/bpmn:outgoing>\n        \u003c/bpmn:task>\n        \u003cbpmn:exclusiveGateway id=\"pass\" name=\"测试通过？\">\n          \u003cbpmn:incoming>edge-9\u003c/bpmn:incoming>\n          \u003cbpmn:outgoing>edge-10\u003c/bpmn:outgoing>\n          \u003cbpmn:outgoing>edge-11\u003c/bpmn:outgoing>\n        \u003c/bpmn:exclusiveGateway>\n        \u003cbpmn:task id=\"refactor\" name=\"重构并运行回归\">\n          \u003cbpmn:incoming>edge-11\u003c/bpmn:incoming>\n          \u003cbpmn:outgoing>edge-12\u003c/bpmn:outgoing>\n        \u003c/bpmn:task>\n        \u003cbpmn:exclusiveGateway id=\"stable\" name=\"回归通过？\">\n          \u003cbpmn:incoming>edge-12\u003c/bpmn:incoming>\n          \u003cbpmn:outgoing>edge-13\u003c/bpmn:outgoing>\n          \u003cbpmn:outgoing>tdd_exit_bridge\u003c/bpmn:outgoing>\n        \u003c/bpmn:exclusiveGateway>\n        \u003cbpmn:sequenceFlow id=\"edge-8\" name=\"\" sourceRef=\"red\" targetRef=\"green\" />\n        \u003cbpmn:sequenceFlow id=\"edge-9\" name=\"\" sourceRef=\"green\" targetRef=\"pass\" />\n        \u003cbpmn:sequenceFlow id=\"edge-10\" name=\"测试未通过，继续实现\" sourceRef=\"pass\" targetRef=\"green\" />\n        \u003cbpmn:sequenceFlow id=\"edge-11\" name=\"测试通过，开始重构\" sourceRef=\"pass\" targetRef=\"refactor\" />\n        \u003cbpmn:sequenceFlow id=\"edge-12\" name=\"\" sourceRef=\"refactor\" targetRef=\"stable\" />\n        \u003cbpmn:sequenceFlow id=\"edge-13\" name=\"回归失败，修复实现\" sourceRef=\"stable\" targetRef=\"green\" />\n        \u003cbpmn:sequenceFlow id=\"tdd_entry_bridge\" name=\"\" sourceRef=\"tdd_start\" targetRef=\"red\" />\n        \u003cbpmn:sequenceFlow id=\"tdd_exit_bridge\" name=\"\" sourceRef=\"stable\" targetRef=\"tdd_end\" />\n      \u003c/bpmn:subProcess>\n      \u003cbpmn:task id=\"choose\" name=\"选择待实现单元\">\n        \u003cbpmn:incoming>edge-15\u003c/bpmn:incoming>\n        \u003cbpmn:incoming>work_entry_bridge\u003c/bpmn:incoming>\n        \u003cbpmn:outgoing>edge-7\u003c/bpmn:outgoing>\n      \u003c/bpmn:task>\n      \u003cbpmn:sequenceFlow id=\"edge-7\" name=\"\" sourceRef=\"choose\" targetRef=\"tdd\" />\n      \u003cbpmn:sequenceFlow id=\"edge-14\" name=\"回归通过，本单元完成\" sourceRef=\"tdd\" targetRef=\"next\" />\n      \u003cbpmn:sequenceFlow id=\"edge-15\" name=\"仍有单元待实现\" sourceRef=\"next\" targetRef=\"choose\" />\n      \u003cbpmn:sequenceFlow id=\"work_entry_bridge\" name=\"\" sourceRef=\"work_start\" targetRef=\"choose\" />\n      \u003cbpmn:sequenceFlow id=\"work_exit_bridge\" name=\"\" sourceRef=\"next\" targetRef=\"work_end\" />\n    \u003c/bpmn:subProcess>\n    \u003cbpmn:subProcess id=\"delivery\" name=\"测试与复核\">\n      \u003cbpmn:incoming>edge-16\u003c/bpmn:incoming>\n      \u003cbpmn:outgoing>edge-25\u003c/bpmn:outgoing>\n      \u003cbpmn:startEvent id=\"delivery_start\">\n        \u003cbpmn:outgoing>delivery_entry_bridge\u003c/bpmn:outgoing>\n      \u003c/bpmn:startEvent>\n      \u003cbpmn:endEvent id=\"delivery_end\">\n        \u003cbpmn:incoming>delivery_exit_bridge\u003c/bpmn:incoming>\n      \u003c/bpmn:endEvent>\n      \u003cbpmn:task id=\"pack\" name=\"汇总测试结果\">\n        \u003cbpmn:incoming>edge-21\u003c/bpmn:incoming>\n        \u003cbpmn:outgoing>delivery_exit_bridge\u003c/bpmn:outgoing>\n      \u003c/bpmn:task>\n      \u003cbpmn:parallelGateway id=\"fork\" name=\"并行复核\">\n        \u003cbpmn:incoming>delivery_entry_bridge\u003c/bpmn:incoming>\n        \u003cbpmn:outgoing>edge-17\u003c/bpmn:outgoing>\n        \u003cbpmn:outgoing>edge-18\u003c/bpmn:outgoing>\n      \u003c/bpmn:parallelGateway>\n      \u003cbpmn:task id=\"review\" name=\"检查设计符合性\">\n        \u003cbpmn:incoming>edge-17\u003c/bpmn:incoming>\n        \u003cbpmn:outgoing>edge-19\u003c/bpmn:outgoing>\n      \u003c/bpmn:task>\n      \u003cbpmn:task id=\"verify\" name=\"执行整体验证\">\n        \u003cbpmn:incoming>edge-18\u003c/bpmn:incoming>\n        \u003cbpmn:outgoing>edge-20\u003c/bpmn:outgoing>\n      \u003c/bpmn:task>\n      \u003cbpmn:parallelGateway id=\"join\" name=\"等待全部复核\">\n        \u003cbpmn:incoming>edge-19\u003c/bpmn:incoming>\n        \u003cbpmn:incoming>edge-20\u003c/bpmn:incoming>\n        \u003cbpmn:outgoing>edge-21\u003c/bpmn:outgoing>\n      \u003c/bpmn:parallelGateway>\n      \u003cbpmn:sequenceFlow id=\"edge-17\" name=\"\" sourceRef=\"fork\" targetRef=\"review\" />\n      \u003cbpmn:sequenceFlow id=\"edge-18\" name=\"\" sourceRef=\"fork\" targetRef=\"verify\" />\n      \u003cbpmn:sequenceFlow id=\"edge-19\" name=\"\" sourceRef=\"review\" targetRef=\"join\" />\n      \u003cbpmn:sequenceFlow id=\"edge-20\" name=\"\" sourceRef=\"verify\" targetRef=\"join\" />\n      \u003cbpmn:sequenceFlow id=\"edge-21\" name=\"\" sourceRef=\"join\" targetRef=\"pack\" />\n      \u003cbpmn:sequenceFlow id=\"delivery_entry_bridge\" name=\"\" sourceRef=\"delivery_start\" targetRef=\"fork\" />\n      \u003cbpmn:sequenceFlow id=\"delivery_exit_bridge\" name=\"\" sourceRef=\"pack\" targetRef=\"delivery_end\" />\n    \u003c/bpmn:subProcess>\n    \u003cbpmn:exclusiveGateway id=\"ready\" name=\"整体测试通过？\">\n      \u003cbpmn:incoming>edge-25\u003c/bpmn:incoming>\n      \u003cbpmn:outgoing>edge-24\u003c/bpmn:outgoing>\n      \u003cbpmn:outgoing>reconsider-design\u003c/bpmn:outgoing>\n      \u003cbpmn:outgoing>repair-implementation\u003c/bpmn:outgoing>\n      \u003cbpmn:outgoing>stop-work\u003c/bpmn:outgoing>\n    \u003c/bpmn:exclusiveGateway>\n    \u003cbpmn:endEvent id=\"e\" name=\"完成\">\n      \u003cbpmn:incoming>edge-24\u003c/bpmn:incoming>\n    \u003c/bpmn:endEvent>\n    \u003cbpmn:endEvent id=\"aborted\" name=\"退出\">\n      \u003cbpmn:incoming>stop-work\u003c/bpmn:incoming>\n      \u003cbpmn:terminateEventDefinition id=\"aborted_termination\" />\n    \u003c/bpmn:endEvent>\n    \u003cbpmn:sequenceFlow id=\"edge-1\" name=\"\" sourceRef=\"s\" targetRef=\"plan\" />\n    \u003cbpmn:sequenceFlow id=\"edge-6\" name=\"\" sourceRef=\"plan\" targetRef=\"work\" />\n    \u003cbpmn:sequenceFlow id=\"edge-16\" name=\"全部单元已完 -5_di\" bpmnElement=\"edge-5\">\n        \u003cdi:waypoint x=\"650\" y=\"280\" />\n        \u003cdi:waypoint x=\"750\" y=\"280\" />\n        \u003cdi:waypoint x=\"750\" y=\"165\" />\n      \u003c/bpmndi:BPMNEdge>\n    \u003c/bpmndi:BPMNPlane>\n  \u003c/bpmndi:BPMNDiagram>\n\u003c/bpmn:definitions>\n"}},$=id=>document.getElementById(id);let modeler=null,graph=null,revision=0;function groups(){const ir=DATA.irs[$('sample').value];$('group').innerHTML=ir.nodes.filter(n=>n.kind==='group').map(n=>`<option value="${n.id}">${n.title}</option>`).join('');}
async function load(){const rev=++revision,system=$('system').value,name=$('sample').value,state=$('state').value;try{if(modeler){modeler.destroy();modeler=null;}if(system!=='maxgraph')maxSpike.dispose();$('maxlayout').style.display=system==='maxgraph'?'inline-block':'none';$('canvas').innerHTML='';$('mini').style.display=system==='maxgraph'?'block':'none';$('status').textContent='加载中';if(system==='plantuml'){$('canvas').innerHTML='<iframe id="plant" src="plantuml-output/'+name+'.svg"></iframe>';$('note').textContent='PlantUML：手工结构化的活动流程，仅验证语法引擎整体生成；不是对原始任意跨层图的无损转换。此页未实现折叠或运镜。';$('status').textContent='结构化活动图原始 SVG';return;}
if(system==='maxgraph'){graph=maxSpike.load($('canvas'),$('mini'),DATA.irs[name]);const gs=DATA.irs[name].nodes.filter(n=>n.kind==='group');for(const g of gs)if(state==='collapsed'||state==='plan'&&g.id!==gs[0].id)maxSpike.fold(g.id,true,false);maxSpike.layout($('maxlayout').value);$('note').textContent='maxGraph：原始父子关系和跨层边未改。自动布局为各层调用内置 HierarchicalLayout，折叠、连线提升、缩略图与进入组均使用库的原生能力；没有自写路线或节点坐标。';$('status').textContent='已加载；折叠不会自动重新布局，单独点击重新布局观察区别。';return;}
const engine=system==='bpmn-next'?'next':'stable',key=name+'-scoped-'+state+'-'+engine+'.bpmn';modeler=new BpmnJS({container:$('canvas')});const result=await modeler.importXML(DATA.xml[key]);if(rev!==revision)return;modeler.get('canvas').zoom('fit-viewport',true);$('status').textContent='导入警告 '+result.warnings.length+'；点击原生折叠可观察它是否自动腾挪空间。';$('note').textContent='BPMN：使用有明确边界的子流程模型，外部线连接容器，内部有开始 / 结束。不是直接穿透内部节点。原生折叠仅改变当前模型；重新布局将加载该状态的自动布局结果。bpmn.io 标记按许可证保留。';window.bpmnModeler=modeler;
}catch(e){$('status').textContent='失败：'+e.message;window.lastError=e.message;}}
for(const id of ['system','state','maxlayout'])$(id).onchange=load;$('sample').onchange=()=>{groups();load();};$('fit').onclick=()=>{if($('system').value==='maxgraph')graph.getPlugin('fit').fitCenter({border:30});else modeler?.get('canvas').zoom('fit-viewport',true);};$('layout').onclick=()=>{$('system').value==='maxgraph'?maxSpike.layout($('maxlayout').value):load();};$('toggle').onclick=()=>{try{const id=$('group').value;if($('system').value==='maxgraph'){const n=maxSpike.snapshot().nodes.find(n=>n.id===id);maxSpike.fold(id,!n.collapsed,false);}else if(modeler){const s=modeler.get('elementRegistry').get(id);modeler.get('modeling').toggleCollapse(s);modeler.get('canvas').zoom('fit-viewport',true);}$('status').textContent='原生折叠 / 展开完成（未额外调用布局）。';}catch(e){$('status').textContent='原生操作失败：'+e.message;}};
$('enter').onclick=()=>{try{if($('system').value==='maxgraph')maxSpike.navigate($('group').value);else if(modeler){const canvas=modeler.get('canvas'),root=canvas.findRoot($('group').value+'_plane');if(!root)throw Error('该组当前没有独立子图平面；先折叠再进入');canvas.setRootElement(root);canvas.zoom('fit-viewport',true);}}catch(e){$('status').textContent=e.message;}};
