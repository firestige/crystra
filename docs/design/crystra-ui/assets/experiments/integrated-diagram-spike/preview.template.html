<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>完整绘图系统 Spike</title><link rel="stylesheet" href="node_modules/bpmn-js/dist/assets/diagram-js.css"><link rel="stylesheet" href="node_modules/bpmn-js/dist/assets/bpmn-font/css/bpmn.css"><link rel="stylesheet" href="node_modules/@maxgraph/core/css/common.css"><style>
*{box-sizing:border-box}body{margin:0;font:14px system-ui;color:#303641;background:#e9ebee}header{padding:20px 26px;background:#f7f8f9}h1{font-size:20px;margin:0 0 15px}select,button{font:inherit;border:1px solid #cdd1d6;border-radius:6px;background:#fff;padding:7px 10px;margin:0 7px 8px 0}#status{font-size:13px;color:#5e6874;line-height:1.7;min-height:22px}main{margin:18px 24px;position:relative;height:710px;border-radius:12px;overflow:hidden;background:#fff;box-shadow:0 2px 8px #27384918;border:1px solid #fff8}#canvas{width:100%;height:100%;position:relative;overflow:hidden}#mini{position:absolute;left:12px;bottom:12px;width:220px;height:145px;background:#f6f7f8e8;border:1px solid #bdc7d3;border-radius:8px;overflow:hidden}footer{padding:0 26px 20px;color:#596573;line-height:1.8}#plant{width:100%;height:100%;border:0}a{color:#35668f}.djs-palette{display:none}
</style><header><h1>完整绘图系统 Spike · 布局、边界与原生交互</h1><select id="system"><option value="bpmn-next">BPMN 2.0 alpha + bpmn-js</option><option value="bpmn-stable">BPMN 1.3 稳定版 + bpmn-js</option><option value="maxgraph">maxGraph · 原始跨层图</option><option value="plantuml">PlantUML · 结构化活动图</option></select><select id="maxlayout" style="display:none"><option value="scope">按层调用布局</option><option value="global">全图布局并更新组边界</option></select><select id="sample"><option value="development">开发流程</option><option value="architecture">架构设计</option><option value="research">科研管理</option></select><select id="state"><option value="collapsed">顶层折叠</option><option value="plan">展开第一组</option><option value="expanded">全部展开</option></select><select id="group"></select><button id="toggle">原生展开 / 折叠</button><button id="enter">进入组</button><button id="home">回总览</button><button id="layout">重新布局</button><button id="fit">适应视图</button><div id="status"></div></header><main><div id="canvas"></div><div id="mini"></div></main><footer id="note"></footer><script src="node_modules/bpmn-js/dist/bpmn-modeler.production.min.js"></script><script src="maxgraph-bundle.js"></script><script>
const DATA=/*DATA*/,$=id=>document.getElementById(id);let modeler=null,graph=null,revision=0;function groups(){const ir=DATA.irs[$('sample').value];$('group').innerHTML=ir.nodes.filter(n=>n.kind==='group').map(n=>`<option value="${n.id}">${n.title}</option>`).join('');}
async function load(){const rev=++revision,system=$('system').value,name=$('sample').value,state=$('state').value;try{if(modeler){modeler.destroy();modeler=null;}if(system!=='maxgraph')maxSpike.dispose();$('maxlayout').style.display=system==='maxgraph'?'inline-block':'none';$('canvas').innerHTML='';$('mini').style.display=system==='maxgraph'?'block':'none';$('status').textContent='加载中';if(system==='plantuml'){$('canvas').innerHTML='<iframe id="plant" src="plantuml-output/'+name+'.svg"></iframe>';$('note').textContent='PlantUML：手工结构化的活动流程，仅验证语法引擎整体生成；不是对原始任意跨层图的无损转换。此页未实现折叠或运镜。';$('status').textContent='结构化活动图原始 SVG';return;}
if(system==='maxgraph'){graph=maxSpike.load($('canvas'),$('mini'),DATA.irs[name]);const gs=DATA.irs[name].nodes.filter(n=>n.kind==='group');for(const g of gs)if(state==='collapsed'||state==='plan'&&g.id!==gs[0].id)maxSpike.fold(g.id,true,false);maxSpike.layout($('maxlayout').value);$('note').textContent='maxGraph：原始父子关系和跨层边未改。自动布局为各层调用内置 HierarchicalLayout，折叠、连线提升、缩略图与进入组均使用库的原生能力；没有自写路线或节点坐标。';$('status').textContent='已加载；折叠不会自动重新布局，单独点击重新布局观察区别。';return;}
const engine=system==='bpmn-next'?'next':'stable',key=name+'-scoped-'+state+'-'+engine+'.bpmn';modeler=new BpmnJS({container:$('canvas')});const result=await modeler.importXML(DATA.xml[key]);if(rev!==revision)return;modeler.get('canvas').zoom('fit-viewport',true);$('status').textContent='导入警告 '+result.warnings.length+'；点击原生折叠可观察它是否自动腾挪空间。';$('note').textContent='BPMN：使用有明确边界的子流程模型，外部线连接容器，内部有开始 / 结束。不是直接穿透内部节点。原生折叠仅改变当前模型；重新布局将加载该状态的自动布局结果。bpmn.io 标记按许可证保留。';window.bpmnModeler=modeler;
}catch(e){$('status').textContent='失败：'+e.message;window.lastError=e.message;}}
for(const id of ['system','state','maxlayout'])$(id).onchange=load;$('sample').onchange=()=>{groups();load();};$('fit').onclick=()=>{if($('system').value==='maxgraph')graph.getPlugin('fit').fitCenter({border:30});else modeler?.get('canvas').zoom('fit-viewport',true);};$('layout').onclick=()=>{$('system').value==='maxgraph'?maxSpike.layout($('maxlayout').value):load();};$('toggle').onclick=()=>{try{const id=$('group').value;if($('system').value==='maxgraph'){const n=maxSpike.snapshot().nodes.find(n=>n.id===id);maxSpike.fold(id,!n.collapsed,false);}else if(modeler){const s=modeler.get('elementRegistry').get(id);modeler.get('modeling').toggleCollapse(s);modeler.get('canvas').zoom('fit-viewport',true);}$('status').textContent='原生折叠 / 展开完成（未额外调用布局）。';}catch(e){$('status').textContent='原生操作失败：'+e.message;}};
$('enter').onclick=()=>{try{if($('system').value==='maxgraph')maxSpike.navigate($('group').value);else if(modeler){const canvas=modeler.get('canvas'),root=canvas.findRoot($('group').value+'_plane');if(!root)throw Error('该组当前没有独立子图平面；先折叠再进入');canvas.setRootElement(root);canvas.zoom('fit-viewport',true);}}catch(e){$('status').textContent=e.message;}};
$('home').onclick=()=>{if($('system').value==='maxgraph')maxSpike.navigate(null);else if(modeler){const c=modeler.get('canvas');c.setRootElement(c.findRoot('Process'));c.zoom('fit-viewport',true);}};window.spike={load,groups};groups();load();
</script></html>
