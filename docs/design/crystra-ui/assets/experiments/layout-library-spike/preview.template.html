<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>布局库 Spike · 原始结果对照</title><style>
*{box-sizing:border-box}body{margin:0;background:#e9eaed;color:#30353e;font:14px system-ui}header{padding:20px 28px;background:#f7f7f8}h1{font-size:20px;margin:0 0 14px}select,button{font:inherit;padding:7px 10px;border:1px solid #cdd0d5;border-radius:6px;background:#fff;margin-right:10px}main{display:grid;grid-template-columns:1fr 1fr;gap:18px;padding:20px}section{min-width:0;background:#f5f6f7;border:1px solid #fff9;border-radius:14px;box-shadow:0 2px 6px #26304412;overflow:hidden}h2{font-size:15px;margin:0;padding:16px}.stats{padding:0 16px 14px;color:#555;line-height:1.8}svg{width:100%;height:590px;background:#fbfbfc;cursor:grab;touch-action:none}footer{padding:0 28px 22px;line-height:1.8;color:#626772}text{font:16px system-ui;fill:#28343e}.edge{fill:none;stroke-width:2}.node rect{stroke:#9daab8;stroke-width:1}label{font-size:12px;color:#666;margin-right:5px}.note{font-size:13px;color:#626772;margin:10px 0 0}
</style><header><h1>布局库 Spike · 原始结果对照</h1><select id="sample"><option value="development">开发工作流</option><option value="architecture">架构设计</option><option value="research">科研管理</option></select><select id="scope"></select><select id="direction"><option value="RIGHT">横向</option><option value="DOWN">纵向</option></select><button id="fit">适应视图</button><p class="note">滚轮缩放，拖动画布。各层独立求解；“入 / 出”是外部连接代理，并非已经实现的容器接口。矩形障碍模型，不评判活动图最终样式。</p></header><main><section><h2><select id="left"></select></h2><div class="stats" id="s0"></div><svg id="v0"></svg></section><section><h2><select id="right"></select></h2><div class="stats" id="s1"></div><svg id="v1"></svg></section></main><footer>HOLA 仅横向选项下可查看原始自由构图，并未设置横向约束；其路线连接节点中心。<br>原生 ELK：原始方向边与默认端口；约束组：按语义生成推进间距和补救分支对齐，未指定节点坐标。<br>libavoid：四侧可选端口，默认允许端口共享。本对照不包含标签避让、嵌套展开动画；零交叉不代表构图合格。连线悬停查看含义。</footer><script>
const DATA=/*DATA*/;const $=id=>document.getElementById(id),esc=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('"','&quot;');const names={'hola/native':'HOLA · 默认自由构图（无阅读方向约束）','elk/native':'ELK · 原生布局与布线','elk/avoid':'ELK ＋ libavoid','webcola-basic/avoid':'WebCola · 默认流向 ＋ libavoid','webcola/avoid':'WebCola · 语义约束 ＋ libavoid','fcose/avoid':'fCoSE · 语义约束 ＋ libavoid','libcola/avoid':'原生 libcola · 语义约束 ＋ libavoid'};
for(const id of ['left','right'])$(id).innerHTML=Object.entries(names).map(([k,v])=>`<option value="${k}">${v}</option>`).join('');$('left').value='elk/native';$('right').value='libcola/avoid';
function scopes(){const seen=new Map(DATA.filter(r=>r.name===$('sample').value).map(r=>[r.scope||'',r.title||r.scope||'总览']));$('scope').innerHTML=[...seen].map(([k,v])=>`<option value="${k}">${v}</option>`).join('');if($('sample').value==='development')$('scope').value='plan';render();}
function render(){['left','right'].forEach((key,i)=>{const [engine,routing]=$(key).value.split('/'),r=DATA.find(r=>r.name===$('sample').value&&(r.scope||'')===$('scope').value&&r.direction===$('direction').value&&r.engine===engine&&r.routing===routing),svg=$('v'+i);if(!r||r.error){svg.innerHTML='';$('s'+i).textContent=r?.error||'无结果';return;}const l=r.layout,m=r.metrics;const pts=[...l.nodes.flatMap(n=>[{x:n.x-n.width/2,y:n.y-n.height/2},{x:n.x+n.width/2,y:n.y+n.height/2}]),...l.edges.flatMap(e=>e.points)];const minx=Math.min(...pts.map(p=>p.x))-35,miny=Math.min(...pts.map(p=>p.y))-35,w=m.width+70,h=m.height+70;svg.setAttribute('viewBox',`${minx} ${miny} ${w} ${h}`);$('s'+i).textContent=`交叉 ${m.crossings} · 穿越 ${m.blocked} · 重叠 ${m.nodeOverlaps} · 约束违反 ${m.constraintViolations} · 折弯 ${m.bends} · 共线 ${m.sharedLength.toFixed(0)}px ｜布局 ${r.placementMs}ms + 布线 ${r.routingMs}ms`;
 const colors={expected:'#288a7c',recovery:'#9060b3',rework:'#c18a28',exit:'#c05f62'};svg.innerHTML='<defs>'+Object.entries(colors).map(([k,c])=>`<marker id="${k}${i}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="${c}"/></marker>`).join('')+'</defs>'+l.edges.map(e=>`<path class="edge" d="${e.points.map((p,j)=>(j?'L':'M')+p.x+' '+p.y).join(' ')}" stroke="${colors[e.intent]||colors.expected}" ${e.intent!=='expected'?'stroke-dasharray="7 5"':''} marker-end="url(#${e.intent||'expected'}${i})"><title>${esc(e.label||e.id)}: ${esc(e.originalFrom||e.from)} → ${esc(e.originalTo||e.to)}</title></path>`).join('')+l.nodes.map(n=>{const fill=n.kind==='decision'?'#fff0cf':n.kind==='group'?'#e3edf7':n.kind==='boundary'?'#e9dcf4':n.kind==='end'?'#e1efe6':'#eef1f4';const lines=n.title.match(/.{1,10}/gu)||[''];return `<g class="node"><rect x="${n.x-n.width/2}" y="${n.y-n.height/2}" width="${n.width}" height="${n.height}" rx="${n.kind==='boundary'?10:12}" fill="${fill}"/><text text-anchor="middle" x="${n.x}" y="${n.y-(lines.length-1)*10+5}">${lines.map((s,j)=>`<tspan x="${n.x}" dy="${j?21:0}">${esc(s)}</tspan>`).join('')}</text><title>${esc(n.id)} · ${esc(n.kind)}</title></g>`;}).join('');});}
for(const id of ['left','right','scope','direction'])$(id).onchange=render;$('sample').onchange=scopes;$('fit').onclick=render;
for(const svg of document.querySelectorAll('svg')){let drag;svg.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY,b:[...svg.viewBox.baseVal? [svg.viewBox.baseVal.x,svg.viewBox.baseVal.y,svg.viewBox.baseVal.width,svg.viewBox.baseVal.height]:[]]};svg.setPointerCapture(e.pointerId);};svg.onpointerup=()=>drag=null;svg.onpointermove=e=>{if(!drag)return;const scale=Math.max(drag.b[2]/svg.clientWidth,drag.b[3]/svg.clientHeight);svg.setAttribute('viewBox',`${drag.b[0]-(e.clientX-drag.x)*scale} ${drag.b[1]-(e.clientY-drag.y)*scale} ${drag.b[2]} ${drag.b[3]}`);};svg.onwheel=e=>{e.preventDefault();const b=svg.viewBox.baseVal,f=e.deltaY>0?1.12:1/1.12;svg.setAttribute('viewBox',`${b.x+b.width*(1-f)/2} ${b.y+b.height*(1-f)/2} ${b.width*f} ${b.height*f}`);};}scopes();
</script></html>
