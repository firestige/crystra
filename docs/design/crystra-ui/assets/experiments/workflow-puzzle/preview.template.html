<!doctype html><html lang="zh"><meta charset="utf-8"><title>推进与返回 · 布局实验</title><style>
*{box-sizing:border-box}body{margin:0;background:#141518;color:#e9edf3;font:14px system-ui}header{height:68px;display:flex;align-items:center;gap:16px;padding:0 24px;border-bottom:1px solid #ffffff18}h1{font-size:18px;margin:0}small{color:#959da9}button,select{font:inherit;color:inherit;background:transparent;border:0;border-radius:6px;padding:8px;cursor:pointer}button:hover,select{background:#ffffff0c}option{background:#22252c}header .spacer{flex:1}main{display:flex;height:calc(100vh - 68px)}aside{width:230px;flex:none;padding:18px;border-right:1px solid #ffffff18;overflow:auto}aside button{width:100%;display:block;text-align:left;margin:4px 0}aside button.active{background:#8eb7ee20;color:#8eb7ee}section{flex:1;min-width:0;display:flex;flex-direction:column}nav{padding:12px 20px;display:flex;align-items:center;gap:8px}#canvas{width:100%;flex:1;min-height:0;touch-action:none;cursor:grab}#info{min-height:70px;padding:12px 24px;background:#202329;line-height:1.7;border-top:1px solid #ffffff0a}svg text{font-family:inherit;pointer-events:none}svg g.node{cursor:pointer}.node:hover .shape{stroke-width:3}svg path.edge{fill:none;stroke-width:1.6}svg .node-title{fill:#edf2fa;font-size:17px}.boundary{cursor:pointer}.boundary:hover circle{r:8}svg g.block>rect{fill:#1b2e4b33;stroke:#8eb7ee55;stroke-width:1.5}.selected{filter:drop-shadow(0 0 4px #e9edf3)}.hint{color:#a1abba;font-size:12px;line-height:1.8;margin-top:20px}#evidence{position:fixed;right:26px;top:82px;color:#959da9;font-size:12px}
</style><header><h1>推进与返回</h1><small>语义假设实验 · 未定稿</small><span class="spacer"></span><select id="sample" aria-label="样例"><option value="0">开发流程</option><option value="1">系统设计</option><option value="2">科研管理</option></select><select id="direction" aria-label="布局方向"><option value="RIGHT">横向</option><option value="DOWN">纵向</option></select><button id="fit" title="适应当前层">适应</button><button id="all">展开全部</button><button id="collapse">收起全部</button></header><main><aside><small>构件导航</small><div id="outline"></div><p class="hint">点构件名：进入子流程<br>图中 chevron：展开／收起<br>点接口：查看外部来源或去向<br>拖动平移 · 滚轮缩放</p></aside><section><nav id="crumb"></nav><svg id="canvas" role="img" aria-label="拼装活动图"></svg><div id="info">假设 layoutRole 已由用户确认。推进边确定主干；返回边保持真实箭头方向，但不反转主干。</div></section></main><script>
const data=/*DATA*/;let sample=0,direction='RIGHT',mask=0,scope=null,view=null,selected=null;const svg=document.getElementById('canvas'),info=document.getElementById('info');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const source=()=>data[sample],layout=()=>source().layouts[direction+mask],node=id=>source().ir.nodes.find(n=>n.id===id),edge=id=>source().ir.edges.find(e=>e.id===id);
function inside(id,group){if(!group)return true;while(id){if(id===group)return true;id=node(id)?.parent;}return false;}
function enter(id){scope=id;let n=node(id);while(n){if(n.kind==='group')mask|=1<<source().groups.indexOf(n.id);n=node(n.parent);}selected=null;info.textContent='当前层：'+(id?node(id).title:'整个工作流')+' · 推进／返回分类来自实验样例，非正式 JSONIR 契约';render(true);}
function frame(){const l=layout(),g=l.nodes.find(n=>n.id===scope);const r=g||{x:0,y:0,width:l.width,height:l.height};const bs=l.boundaries.filter(b=>b.group===scope),pad=side=>Math.max(80,...bs.filter(b=>b.side===side).map(b=>(node(b.external).title.length+3)*15));const left=pad('WEST'),right=pad('EAST');view={x:r.x-left,y:r.y-90,w:r.width+left+right,h:r.height+180};applyView();}
function applyView(){svg.setAttribute('viewBox',`${view.x} ${view.y} ${view.w} ${view.h}`);}
function color(e){return {expected:'#83c8bc',rework:'#dcb268',recovery:'#acaae7',exit:'#ed939d'}[e.intent]||'#a2a8b4';}
function render(fit=false){const l=layout();document.getElementById('outline').innerHTML='<button data-enter="">整个工作流</button>'+source().groups.map(id=>`<button data-enter="${esc(id)}" class="${scope===id?'active':''}" style="padding-left:${node(id).parent?22:8}px">${esc(node(id).title)}</button>`).join('');document.querySelectorAll('[data-enter]').forEach(b=>b.onclick=()=>enter(b.dataset.enter||null));document.getElementById('crumb').innerHTML=`<button id="back">‹ 返回上层</button><span>${scope?esc(node(scope).title):'整个工作流'}</span>`;document.getElementById('back').onclick=()=>enter(node(scope)?.parent||null);
let out='<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8" fill="context-stroke"/></marker></defs>';
for(const n of l.nodes.filter(n=>n.expanded&&inside(n.id,scope))){out+=`<g class="block"><rect x="${n.x}" y="${n.y}" width="${n.width}" height="${n.height}" rx="14"/><text x="${n.x+n.width/2}" y="${n.y+28}" text-anchor="middle" fill="#8eb7ee" font-size="17">${esc(node(n.id).title)}</text><g data-toggle="${esc(n.id)}" role="button" aria-label="收起 ${esc(node(n.id).title)}" style="cursor:pointer"><rect x="${n.x+n.width-40}" y="${n.y+5}" width="32" height="32" fill="transparent"/><path d="M${n.x+n.width-32} ${n.y+25}l8 -8l8 8" fill="none" stroke="#8eb7ee" stroke-width="2"/></g></g>`;}
for(const e of l.edges.filter(e=>!scope||e.scope===scope||inside(e.scope,scope))){const s=edge(e.originalId),last=e.points.at(-1),actual=l.nodes.find(n=>n.id===s.to&&!n.expanded),end=actual&&last.x>=actual.x-.1&&last.x<=actual.x+actual.width+.1&&last.y>=actual.y-.1&&last.y<=actual.y+actual.height+.1;out+=`<path class="edge ${selected===e.originalId?'selected':''}" data-edge="${esc(e.originalId)}" d="${e.points.map((p,i)=>(i?'L':'M')+p.x+' '+p.y).join(' ')}" stroke="${color(s)}" ${s.intent!=='expected'?'stroke-dasharray="7 4"':''} ${end?'marker-end="url(#arrow)"':''}><title>${esc(s.label||'继续')} · ${esc(node(s.from).title)} → ${esc(node(s.to).title)}</title></path>`;if(e.label){const t=e.label;out+=`<g><rect x="${t.x}" y="${t.y}" width="${t.width}" height="${t.height}" rx="4" fill="#141518"/><text x="${t.x+4}" y="${t.y+17}" fill="${color(s)}" font-size="14">${t.text.split('\n').map((line,i)=>`<tspan x="${t.x+4}" dy="${i?20:0}">${esc(line)}</tspan>`).join('')}</text></g>`;}}
for(const n of l.nodes.filter(n=>!n.expanded&&inside(n.id,scope))){const s=node(n.id),cx=n.x+n.width/2,cy=n.y+n.height/2,c=s.kind==='decision'?'#dcb268':s.kind==='group'?'#8eb7ee':s.outcome==='terminated'?'#ed939d':'#83c8bc';let shape=s.kind==='decision'?`<path class="shape" d="M${cx} ${n.y}L${n.x+n.width} ${cy}L${cx} ${n.y+n.height}L${n.x} ${cy}Z"/>`:['start','end'].includes(s.kind)?`<circle class="shape" cx="${cx}" cy="${cy}" r="24"/>${s.kind==='end'?`<text x="${cx}" y="${cy+7}" text-anchor="middle" fill="${c}" font-size="24">${s.outcome==='terminated'?'×':'●'}</text>`:''}`:`<rect class="shape" x="${n.x}" y="${n.y}" width="${n.width}" height="${n.height}" rx="${['fork','join'].includes(s.kind)?0:12}"/>`;
out+=`<g class="node" data-node="${esc(n.id)}" style="fill:${c}20;stroke:${c}">${shape}<text class="node-title" stroke="none" text-anchor="middle" x="${cx}" y="${['start','end','fork','join'].includes(s.kind)?n.y+n.height+23:cy+6}">${esc(s.title)}</text>${s.kind==='group'?`<g data-toggle="${esc(n.id)}" role="button" aria-label="展开 ${esc(s.title)}"><rect x="${n.x+n.width-35}" y="${n.y+n.height-30}" width="28" height="26" fill="transparent" stroke="none"/><path d="M${n.x+n.width-27} ${n.y+n.height-22}l6 6l6 -6" fill="none" stroke-width="2"/></g>`:''}</g>`;}
for(const b of l.boundaries.filter(b=>!scope||inside(b.group,scope))){const s=edge(b.edgeId),c=color(s),show=scope===b.group;const text=(b.direction==='in'?'来自 ':'前往 ')+node(b.external).title;const horizontal=['WEST','EAST'].includes(b.side),tx=b.x+(b.side==='WEST'?-12:b.side==='EAST'?12:0),ty=b.y+(b.side==='NORTH'?-14:b.side==='SOUTH'?24:5);out+=`<g class="boundary" data-boundary="${esc(b.id)}"><circle cx="${b.x}" cy="${b.y}" r="5" fill="${c}" stroke="#141518"/><title>${esc(text)} → ${esc(node(b.target).title)}</title>${show?`<text x="${tx}" y="${ty}" text-anchor="${horizontal?(b.side==='WEST'?'end':'start'):'middle'}" fill="${c}" font-size="14">${esc(text)}</text>`:''}</g>`;}
svg.innerHTML=out;svg.querySelectorAll('[data-toggle]').forEach(e=>e.onclick=event=>{event.stopPropagation();const id=e.dataset.toggle;mask^=1<<source().groups.indexOf(id);if(scope===id&&!(mask&(1<<source().groups.indexOf(id))))scope=node(id).parent||null;render(true);});svg.querySelectorAll('[data-node]').forEach(e=>e.onclick=()=>{const n=node(e.dataset.node);if(n.kind==='group')enter(n.id);else info.textContent=n.title+'：'+(n.description||'活动');});svg.querySelectorAll('[data-boundary]').forEach(e=>e.onclick=()=>{const b=l.boundaries.find(b=>b.id===e.dataset.boundary),s=edge(b.edgeId);selected=b.edgeId;info.textContent=`${b.direction==='in'?'输入':'输出'}接口 · ${node(b.external).title} ${b.direction==='in'?'→':'←'} ${node(b.target).title} · ${s.label||'继续'} · 保留原始关系 ${s.id}`;render();});if(fit||!view)frame();else applyView();}
document.getElementById('sample').onchange=e=>{sample=+e.target.value;mask=0;scope=null;render(true);};document.getElementById('direction').onchange=e=>{direction=e.target.value;render(true);};document.getElementById('fit').onclick=frame;document.getElementById('all').onclick=()=>{mask=2**source().groups.length-1;render(true);};document.getElementById('collapse').onclick=()=>{mask=0;scope=null;render(true);};let drag=null;svg.onpointerdown=e=>{if(e.target.closest('[data-node],[data-toggle],[data-boundary]'))return;drag={x:e.clientX,y:e.clientY,view:{...view}};svg.setPointerCapture(e.pointerId);};svg.onpointermove=e=>{if(!drag)return;const k=Math.max(drag.view.w/svg.clientWidth,drag.view.h/svg.clientHeight);view={...drag.view,x:drag.view.x-(e.clientX-drag.x)*k,y:drag.view.y-(e.clientY-drag.y)*k};applyView();};svg.onpointerup=()=>drag=null;svg.onwheel=e=>{e.preventDefault();const k=e.deltaY>0?1.12:1/1.12;view={x:view.x+view.w*(1-k)/2,y:view.y+view.h*(1-k)/2,w:view.w*k,h:view.h*k};applyView();};render(true);
</script></html>
