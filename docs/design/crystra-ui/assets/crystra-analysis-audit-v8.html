      tooltipOwner = null;

      const name = active;

      if (name === 'tasks') {
        taskSearchInput.value = '';
        setTaskSearchOpen(false);
        setTaskViewOptionsOpen(false);
        setTaskSectionExpanded(savedExpanded);
        renderTaskList();
      } else if (name === 'workflows') {
        setWorkflowExpanded(savedExpanded);
      } else {
        route.panel.dataset.expanded = String(savedExpanded);
        route.toggle.setAttribute('aria-expanded', String(savedExpanded));
        route.content.hidden = !savedExpanded;
      }
      route.panel.removeAttribute('data-sidebar-flyout');
      section('sidebar-rail-' + name).setAttribute('aria-expanded', 'false');
      active = null;
      if (restoreFocus) section('sidebar-rail-' + name).focus();

      sidebar.querySelector('[data-sidebar-drawer]').inert = animate && value;

      syncBanner();

    });
    const updateAttention = () => {
      const count = [...taskList.querySelectorAll('[data-task-row] [data-section-id$="attention-badge"]')].reduce((sum, badge) => sum + (Number(badge.textContent.trim()) || 0), 0);

      button.dataset.sidebarTooltip = label;

    sidebar.querySelectorAll('[data-sidebar-tooltip], [data-header-tooltip]').forEach(button=>{
      const show = () => {
        if (!button.dataset.headerTooltip && (!collapsed() || active)) return;
        hideTooltip();tooltipOwner=button;
        tooltip.textContent=button.dataset.headerTooltip || button.dataset.sidebarTooltip;
        tooltip.hidden=false;
        const r=button.getBoundingClientRect();
        tooltip.style.left=(button.dataset.headerTooltip ? Math.max(8,Math.min(innerWidth-tooltip.offsetWidth-8,r.left+(r.width-tooltip.offsetWidth)/2)) : r.right+12)+'px';
        tooltip.style.top=Math.max(8,Math.min(innerHeight-tooltip.offsetHeight-8,button.dataset.headerTooltip ? r.bottom+8 : r.top+(r.height-tooltip.offsetHeight)/2))+'px';
        button.setAttribute('aria-describedby','sidebar-preview-tooltip');
      };
      button.addEventListener('mouseenter',show);
      button.addEventListener('focus',show);
      button.addEventListener('mouseleave',hideTooltip);
      button.addEventListener('blur',hideTooltip);
      button.addEventListener('click',hideTooltip);
    });
    window.addEventListener('resize', hideTooltip);
    if (new URLSearchParams(location.search).get('sidebar') === 'collapsed') setCollapsed(true, false);
    // Initial URL state is applied immediately, without an entrance animation.
    requestAnimationFrame(() => requestAnimationFrame(() => { shell.dataset.sidebarMotion = 'ready'; }));
  })();

`,provenance:`仓库内容快照 · 使用关系为展示样例`},{id:`tdd-skill`,kind:`skill`,title:`Evolutionary TDD`,path:`workflow-package/implementation/skills/evolutionary-tdd-implementation/SKILL.md`,nodeIds:[`implement`,`ladder`],description:`从 RED 到 GREEN 的方法`,content:`---
name: evolutionary-tdd-implementation
description: Evolve production implementation from calibrated RED to minimal GREEN through a frozen semantic Test Ladder. Use for implementation and bounded refactor Actions where the Implementer must not change formal tests or expand the frozen design.
---

# Evolutionary TDD Implementation

## Move one rung

1. Read the full Goal boundary and semantic ladder, then focus on the current released tests.
2. Reproduce the recorded RED and diagnose its cause.
3. Make the smallest honest production change that satisfies current behavior.
4. Run the focused command after relevant edits; run affected regression before returning GREEN.
5. Record changed paths, diagnosis, remaining Contract-bound stubs and a recoverable checkpoint.

Treat the implementation as an evolutionary prototype. Keep it in the candidate path and deepen it rung by rung. Stub only later collaborators behind known Contracts; bind every stub to a replacement rung. Never stub the current core behavior.

## Refactor only under GREEN

Improve project-relevant clarity, duplication or structure while tests remain GREEN. Prefer \`NO_REFACTOR_NEEDED\` over speculative abstraction. Do not add future capabilities, generic reliability machinery or unrelated cleanup.

Never edit formal tests, fixtures, Harness/coverage/writer configuration or Git history. Do not skip tests, retry unchanged flaky tests to GREEN, launch another Workflow or claim Goal completion.
`,provenance:`仓库内容快照 · 使用关系为展示样例`},{id:`ladder-template`,kind:`template`,title:`Semantic Test Ladder`,path:`workflow-package/implementation/templates/test-ladder.template.md`,nodeIds:[`calibrate`,`implement`,`verify-rung`,`ladder`],description:`阶梯与 Oracle 的材料结构`,content:"# Semantic Test Ladder\n\n| Rung | Topic | Applicability | Observable behavior / Oracle | Stub replacement | Evidence state |\n| --- | --- | --- | --- | --- | --- |\n| `R1` | Interface/Contract and Harness calibration | `[state]` | `[behavior]` | `[none/item]` | `PLANNED` |\n| `R2` | Minimum core success | `[state]` | `[behavior]` | `[item]` | `PLANNED` |\n| `R3` | Remaining functional scenarios | `[state]` | `[behavior]` | `[item]` | `PLANNED` |\n| `R4` | Applicable boundary/failure/control behavior | `[state]` | `[behavior]` | `[item]` | `PLANNED` |\n| `R5` | Real collaboration | `[state]` | `[behavior]` | `[item]` | `PLANNED` |\n| `R6` | Behavior branch correctness | `[state]` | `[coverage/assertion]` | `[none]` | `PLANNED` |\n| `R7` | Applicable measurable qualities | `[state]` | `[threshold/method]` | `[none]` | `PLANNED` |\n| `R8` | Regression/composition | `[state]` | `[suite]` | `[none]` | `PLANNED` |\n\nAllowed applicability: `APPLICABLE | NOT_APPLICABLE | BLOCKED | DEFERRED`. `NOT_APPLICABLE` requires a project-specific reason.\n",provenance:`仓库内容快照 · 使用关系为展示样例`},{id:`test-script`,kind:`script`,title:`Implementation Test`,path:`workflow-package/implementation/cli/bin/implementation-test.mjs`,nodeIds:[`implement`,`verify-rung`,`ladder`],description:`按 Harness 绑定执行测试`,content:`#!/usr/bin/env node
import path from "node:path";

import {
  CliError, emit, handleError, parseArguments, readJson, requireOption, run, sha256File,
} from "../lib/core.mjs";

try {
  const { positional, options } = parseArguments(process.argv.slice(2));
  if (positional[0] !== "run") throw new CliError("UNKNOWN_COMMAND", "expected 'run'");
  const project = path.resolve(requireOption(options, "project"));
  const bindingFile = path.resolve(requireOption(options, "binding"));
  const phase = requireOption(options, "phase");
  const binding = readJson(bindingFile);
  const command = binding.commands?.[phase];
  if (!command || !Array.isArray(command.argv) || command.argv.length === 0 || command.argv.some((value) => typeof value !== "string" || !value)) {
    throw new CliError("INVALID_HARNESS_COMMAND", \`phase '\${phase}' must declare a non-empty argv array\`);
  }
  const startedAt = new Date().toISOString();
  const result = run(command.argv[0], command.argv.slice(1), { cwd: project });
  const output = {
    status: result.status === 0 ? "PASSED" : "FAILED",
    code: result.status === 0 ? undefined : "HARNESS_COMMAND_FAILED",
    phase,
    argv: command.argv,
    binding_sha256: sha256File(bindingFile),
    started_at: startedAt,
    finished_at: new Date().toISOString(),
    exit_status: result.status,
    stdout: result.stdout,
    stderr: result.stderr,
  };
  emit(output, result.status === 0 ? 0 : 1);
} catch (error) {
  handleError(error);
}

scription:`同一候选交给隔离的 Goal Adversary 黑盒复核与 Implementation Reviewer 白盒复核，等待两者完成后汇总 Finding。测试侧问题交 IM-14T，代码侧交 IM-14I，IM-15 由原 Finding 视角重新检查；未关闭返回 IM-13。聚合器不能代替原视角关闭 Finding。`,output:`Goal 范围 Finding 已关闭或无 Finding`,sourceRef:`workflow-package/implementation/workflow.md §3 / IM-12–15`},{id:`commit`,kind:`activity`,title:`提交已验证 Goal`,summary:`IM-16 · Custodian`,description:`验证当前 Goal 满足提交条件后执行 Goal commit，再返回 IM-06 选择下一个 Goal/rung。`,output:`已验证 Goal commit`,sourceRef:`workflow-package/implementation/workflow.md §3 / IM-16`,role:`Custodian`},{id:`whole-verify`,kind:`group`,title:`全范围验证`,summary:`IM-17 · 回归与双复核`,description:`全部 Goal 提交后运行全范围回归及两种独立复核。有 Finding 进入 IM-13 → IM-14T / IM-14I → IM-15；全范围 Finding 关闭后回到 IM-17。本概览折叠这段修复循环，保留 whole scope，不误回到 Goal commit。`,output:`回归与双复核全部通过`,sourceRef:`workflow-package/implementation/workflow.md §3 / IM-17; IM-13–15`},{id:`finalize`,kind:`activity`,title:`终门校验`,summary:`IM-18 · Custodian`,description:`检查证据、工作区和完成条件。通过后才输出 VERIFIED_IMPLEMENTATION_READY；不会默认合并、推送、发 PR 或部署。`,output:`VERIFIED_IMPLEMENTATION_READY`,sourceRef:`workflow-package/implementation/workflow.md §3 / IM-18`,role:`Custodian`},{id:`done`,kind:`final`,title:`实现就绪`,summary:`Delivery 终态`,description:`VERIFIED_IMPLEMENTATION_READY 是此 Delivery 的成功终态，不代表 Task 自动终结。`,output:`VERIFIED_IMPLEMENTATION_READY`,sourceRef:`workflow-package/implementation/workflow.md §3 / IM-18`},{id:`calibrate`,kind:`activity`,title:`校准测试`,summary:`IM-07 · Test Designer`,description:`先物化并校准 formal tests。得到可区分的 RED 或经过挑战的 existing-GREEN 后才能进入实现；Goal 或 Oracle 歧义返回 IM-03。Test Designer 与实现隔离。`,output:`校准的测试与 Oracle`,sourceRef:`workflow-package/implementation/workflow.md §3 / IM-07`,role:`Test Designer`},{id:`implement`,kind:`activity`,title:`编写 / 修改实现`,summary:`IM-08 · Implementer`,description:`仅修改生产实现以满足当前 rung 的校准测试，不修改 formal tests 或 harness。返回结果供 Runtime 按已声明路径路由。`,output:`测试结果与诊断进展`,sourceRef:`workflow-package/implementation/workflow.md §3 / IM-08`,role:`Implementer`},{id:`rung-result`,kind:`d
